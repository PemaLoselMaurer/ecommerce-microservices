syntax = "proto3";
package order;
option go_package = "ecommerce-microservices/proto";

service OrderService {
  rpc CreateOrder (CreateOrderRequest) returns (Order);
  rpc ListOrdersByCustomer (ListOrdersRequest) returns (stream Order);

  // QuoteOrder prices an order without placing it, using the
  // same pricing function CreateOrder charges by, so checkout
  // can show the customer exactly what they will pay.
  rpc QuoteOrder (QuoteOrderRequest) returns (OrderQuote);
}

message QuoteOrderRequest {
  string product_id = 1;
  int32 quantity = 2;
}

// OrderQuote is the price breakdown returned by the
// calculate-order-price serverless function.
message OrderQuote {
  string product_id = 1;
  string product_name = 2;
  int32 quantity = 3;
  double unit_price = 4;
  double subtotal = 5;
  double discount_rate = 6;
  double discount = 7;
  double delivery_fee = 8;
  double total = 9;
  repeated string pricing_rules = 10;
  string pricing_version = 11;
}

message CreateOrderRequest {
  string customer_id = 1;
  string product_id = 2;
  int32 quantity = 3;
}

message Order {
  string order_id = 1;
  string customer_id = 2;
  string product_id = 3;
  int32 quantity = 4;
  double total_price = 5;
  string status = 6;

  // payment_id is the reference returned by the Payment
  // Service for the charge that paid for this order, so a
  // customer can see the payment their order was settled by.
  string payment_id = 7;

  // product_name is carried on the order so order history can
  // be shown without calling the Product Service again for
  // every line.
  string product_name = 8;

  // The price breakdown from the calculate-order-price
  // serverless function. total_price is subtotal - discount +
  // delivery_fee, and is the amount the Payment Service charged.
  double subtotal = 9;
  double discount = 10;
  double delivery_fee = 11;
  repeated string pricing_rules = 12;
}

message ListOrdersRequest {
  string customer_id = 1;
}
